<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yılan Oyunu</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#000;}
canvas{background:#111;}
</style>
</head>
<body>
<canvas id="snakeCanvas" width="600" height="400"></canvas>
<script>
const canvas=document.getElementById('snakeCanvas');
const ctx=canvas.getContext('2d');
const grid=20;
let snake=[{x:9,y:9}];
let dir={x:1,y:0};
let apple={x:5,y:5};
let speed=200;

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='red';ctx.fillRect(apple.x*grid,apple.y*grid,grid,grid);
  ctx.fillStyle='lime';snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-1,grid-1));
}

function update(){
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  snake.unshift(head);
  if(head.x===apple.x && head.y===apple.y){
    apple.x=Math.floor(Math.random()*(canvas.width/grid));
    apple.y=Math.floor(Math.random()*(canvas.height/grid));
  }else snake.pop();
  if(head.x<0||head.y<0||head.x>=canvas.width/grid||head.y>=canvas.height/grid)
    snake=[{x:9,y:9}],dir={x:1,y:0};
  for(let i=1;i<snake.length;i++) if(head.x===snake[i].x && head.y===snake[i].y)
    snake=[{x:9,y:9}],dir={x:1,y:0};
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp' && dir.y===0) dir={x:0,y:-1};
  if(e.key==='ArrowDown' && dir.y===0) dir={x:0,y:1};
  if(e.key==='ArrowLeft' && dir.x===0) dir={x:-1,y:0};
  if(e.key==='ArrowRight' && dir.x===0) dir={x:1,y:0};
});

setInterval(()=>{update();draw();},speed);
</script>
</body>
</html>
