<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Routine - Mesajlaşma Simülasyonu</title>
<style>
body { margin:0; font-family:sans-serif; background:#ece5dd; display:flex; justify-content:center; padding:20px; }
.container { width:950px; display:flex; gap:10px; }
.panel { background:#fff; border-radius:16px; box-shadow:0 12px 28px rgba(0,0,0,0.25); padding:10px; display:flex; flex-direction:column; }
.panel h3 { margin:6px 0; text-align:center; }
.login { width:300px; display:flex; flex-direction:column; align-items:center; padding:20px; background:#fff; border-radius:16px; box-shadow:0 12px 28px rgba(0,0,0,0.25); }
.login input, .login button { width:90%; padding:10px; margin:8px 0; border-radius:12px; border:1px solid #ccc; font-size:1em; }
.login button { background:#4a90e2; color:#fff; border:none; cursor:pointer; transition:.2s; }
.login button:hover { background:#357ab7; }
.sohbet-list, .user-list { max-height:400px; overflow-y:auto; border:1px solid #ccc; border-radius:8px; padding:6px; }
.sohbet-list div, .user-list div { padding:6px 8px; cursor:pointer; border-radius:6px; margin-bottom:4px; background:#f5f5f5; transition:.2s; }
.sohbet-list div:hover, .user-list div:hover { background:#d0e1fd; }
.chat-container { width:500px; display:flex; flex-direction:column; height:600px; }
.chat-header { background:#4a90e2; color:#fff; padding:12px; font-weight:bold; text-align:center; border-radius:8px 8px 0 0; }
.joined-info { background:#dfe6e9; padding:6px 12px; border-radius:12px; color:#2d3436; text-align:center; font-size:0.9em; margin:5px 0; }
.chat-messages { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; background:#e0e5f0; }
.msg-card { border-radius:14px; padding:8px 12px; box-shadow:0 4px 8px rgba(0,0,0,0.15); position:relative; animation:fadeIn .3s ease; max-width:75%; word-wrap:break-word; }
.msg-card img, .msg-card video { max-width:100%; margin-top:6px; border-radius:12px; }
.msg-card .delete-btn { position:absolute; top:4px; right:6px; background:#e74c3c; border:none; border-radius:50%; width:20px; height:20px; color:#fff; font-size:12px; cursor:pointer; }
.chat-input { display:flex; padding:8px; border-top:1px solid #ddd; background:#f5f7fa; gap:6px; }
.chat-input textarea { flex:1; border-radius:20px; border:1px solid #ccc; padding:8px; resize:none; font-size:.95em; }
.keyboard { display:flex; flex-wrap:wrap; justify-content:center; margin:8px; gap:5px; }
.key { padding:8px 12px; background:#bdc3c7; border-radius:8px; cursor:pointer; user-select:none; font-weight:bold; }
.key:hover { background:#95a5a6; }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div class="login">
  <h2>Routine</h2>
  <input type="text" id="username" placeholder="Kullanıcı adın">
  <button onclick="enterRoutine()">Giriş Yap</button>
</div>

<div class="container" style="display:none;">
  
  <!-- Sohbet Listesi Paneli -->
  <div class="panel" style="width:200px;">
    <h3>Sohbetler</h3>
    <button onclick="showCreateChat()">Yeni Sohbet Oluştur</button>
    <div class="sohbet-list" id="chatList"></div>
  </div>

  <!-- Mesajlaşma Paneli -->
  <div class="chat-container panel">
    <div class="chat-header" id="chatTitle">Sohbet</div>
    <div id="joinedInfo" class="joined-info"></div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <textarea id="message" placeholder="Mesaj yaz..."></textarea>
      <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
      <button onclick="document.getElementById('fileInput').click()">📎</button>
      <button onclick="sendMessage()">➤</button>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <!-- Kullanıcılar Paneli -->
  <div class="panel" style="width:200px;">
    <h3>Kullanıcılar</h3>
    <div class="user-list" id="userList"></div>
  </div>

</div>

<script>
let currentUser=null;
let currentChat=null;
const keyboardDiv=document.getElementById('keyboard');
const messageInput=document.getElementById('message');

// “Paylaşılan sunucu” simülasyonu
window.sharedChats=window.sharedChats||[];
window.sharedUsers=window.sharedUsers||[];

// Sanal klavye
"QWERTYUIOPASDFGHJKLZXCVBNM ".split('').forEach(k=>{
  const key=document.createElement('div');
  key.className='key';
  key.textContent=k;
  key.onclick=()=>{ messageInput.value+=k; messageInput.focus(); };
  keyboardDiv.appendChild(key);
});

// Kullanıcı girişi
function enterRoutine(){
  const name=document.getElementById('username').value.trim();
  if(!name) return alert("Kullanıcı adı gerekli");
  currentUser=name;
  if(!window.sharedUsers.includes(name)) window.sharedUsers.push(name);
  document.querySelector('.login').style.display='none';
  document.querySelector('.container').style.display='flex';
  renderUserList();
  renderChatList();
}

// Kullanıcılar paneli
function renderUserList(){
  const ul=document.getElementById('userList');
  ul.innerHTML='';
  window.sharedUsers.forEach(u=>{
    const div=document.createElement('div');
    div.textContent=u;
    ul.appendChild(div);
  });
}

// Sohbet listesi
function renderChatList(){
  const listDiv=document.getElementById('chatList');
  listDiv.innerHTML='';
  window.sharedChats.forEach((c,i)=>{
    const div=document.createElement('div');
    div.textContent=`${c.name} (${c.type}${c.type==='private'?', '+c.allowed.join(', '):''})`;
    div.onclick=()=>openChat(i);
    listDiv.appendChild(div);
  });
}

// Yeni sohbet oluştur
function showCreateChat(){
  const chatName=prompt("Sohbet adı girin:");
  if(!chatName) return;
  let type=prompt("Sohbet türü (open/private):","open");
  type=type==='private'?'private':'open';
  let allowed=[];
  if(type==='private'){
    let sel=prompt(`İzin verilen kullanıcıları virgülle girin:\nMevcut kullanıcılar: ${window.sharedUsers.filter(u=>u!==currentUser).join(', ')}`);
    allowed=sel?sel.split(',').map(s=>s.trim()).filter(u=>window.sharedUsers.includes(u)&&u!==currentUser):[];
    if(allowed.length===0){ alert("En az 1 kullanıcı ekleyin"); return; }
  }
  window.sharedChats.push({name:chatName,type:type,allowed:allowed,messages:[]});
  renderChatList();
}

// Sohbete giriş
function openChat(index){
  currentChat=index;
  const chat=window.sharedChats[currentChat];
  document.getElementById('chatTitle').textContent=chat.name;
  document.getElementById('joinedInfo').textContent=`${currentUser} sohbete katıldı`;
  renderMessages();
}

// Mesaj render
function renderMessages(){
  if(currentChat===null) return;
  const chat=window.sharedChats[currentChat];
  const msgDiv=document.getElementById('messages');
  msgDiv.innerHTML='';
  chat.messages.forEach((m,i)=>{
    if(chat.type==='private' && ![currentUser,...chat.allowed].includes(m.from)) return;
    const div=document.createElement('div');
    div.className='msg-card';
    div.style.background=m.from===currentUser?'#4a90e2':'#bdc3c7';
    div.style.color='#fff';
    let content=`<strong>${m.from}</strong>${m.text||''}`;
    if(m.file){
      if(m.file.type.includes('image')) content+=`<img src="${m.file.data}">`;
      if(m.file.type.includes('video')) content+=`<video controls src="${m.file.data}"></video>`;
    }
    content+=`<button class="delete-btn" onclick="deleteMessage(${i})">x</button>`;
    div.innerHTML=content;
    msgDiv.appendChild(div);
  });
  msgDiv.scrollTop=msgDiv.scrollHeight;
}

// Mesaj gönder
function sendMessage(){
  if(currentChat===null) return;
  const text=messageInput.value.trim();
  if(!text) return;
  window.sharedChats[currentChat].messages.push({from:currentUser,text:text});
  messageInput.value='';
  renderMessages();
}

// Mesaj sil
function deleteMessage(index){
  if(currentChat===null) return;
  window.sharedChats[currentChat].messages.splice(index,1);
  renderMessages();
}

// Dosya ekleme
document.getElementById('fileInput').addEventListener('change',function(){
  const file=this.files[0];
  if(!file || currentChat===null) return;
  const reader=new FileReader();
  reader.onload=function(e){
    window.sharedChats[currentChat].messages.push({from:currentUser,text:'',file:{data:e.target.result,type:file.type}});
    renderMessages();
  }
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
